<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>가상요소</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            #box {
                width: 300px;
                height: 400px;
                background-color: lightskyblue;
                margin: 200px auto;
                font: 30px / 400px '';
                text-align: center;
                position: relative;
                
            }

            #box::before {
                width: 100%;
                height: 200px;
                background-color: royalblue;
                content: '';
                position: absolute;
                top: -60px;
                left: 0;
                transform: skewY(-20deg);
                z-index: -1;
            }

            #box::after {
                width: 100%;
                height: 200px;
                background-color: royalblue;
                content: '';
                position: absolute;
                bottom: -60px;
                left: 0;
                transform: skewY(-20deg);
                z-index: -1;
            }

            #list {
                width: 300px;
                border: 10px solid black;
                margin: 100px auto;
            }

            #list li {
                width: 100%;
                height: 100px;
                font: 20px / 100px '';
                padding-left: 100px;
                box-sizing: border-box;
            }

            #list li:nth-child(odd){
                background-color: dimgrey;
            }

            .best::after {
                background-color: dodgerblue;
                color: white;
                font-size: 10px;
                content: 'BEST';
                border-radius: 2px;
                padding: 2px 3px;
                position: relative;
                top: -10px;
                margin: 0 10px;
                animation: twinkle 0.5s alternate infinite;
            }

            .new::after {
                background-color: crimson;
                color: white;
                font-size: 10px;
                content: 'NEW';
                border-radius: 2px;
                padding: 2px 3px;
                position: relative;
                top: -10px;
                left: 10px;
                animation: twinkle 0.5s alternate infinite;
            }

            @keyframes twinkle {
                0% {
                    opacity: 1;
                }

                70% {
                    opacity: 0.7;
                }

                100% {
                    opacity: 0;
                }
            }

        </style>
    </head>
    <body>
        <div id="box">박스</div>

        <ul id="list">
            <li class="best">상품목록1</li>
            <li>상품목록2</li>
            <li class="new">상품목록3</li>
            <li class="new">상품목록4</li>
            <li>상품목록5</li>
        </ul>
    </body>
</html>

<!-- 
    <가상요소>
    html문서 안에 태그를 넣지 않은 상태에서 css로 가상의 요소를 만들어서 스타일 지정
    선택자::before, 선택자::after
    요소의 앞에 before, 요소의 뒤에 after

    **content 속성은 가상요소 내부에 항상 필수적으로 넣어줘야함!!!!!!!
    속성값의 내용이 없더라도 무조건 들어가야함!! => 브라우저가 가상요소라는 것을 인식시켜주기 위함

-->
