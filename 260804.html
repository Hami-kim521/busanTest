            #wrap {
                width: 100%;
            }

            header, section, footer {
                width: 100%;
            }

            #in_header, #container {
                width: 1200px;
                height: 100%;
                background-color: steelblue;
            }

            header {
                height: 100px;
                background-color: lightgrey;
                display: flex;
                justify-content: center;
            }

            #in_header {
                display: flex;
                justify-content: space-between;
            }

            #logo {
                width: 150px;
                height: 100%;
                background-color: tomato;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #menu_wrap {
                width: 800px;
                height: 100%;
                background-color: skyblue;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #menu_wrap li {
                width: 200px;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #sec1 {
                background-color: violet;
                height: 700px;
            }

            #sec2 {
                height: 500px;
                background-color: pink;
                margin: 100px auto;
                display: flex;
                justify-content: center;
            }

            #container {
                display: flex;
                justify-content: space-between;
            }

            .con {
                width: 380px;
                height: 100%;
                background-color: yellowgreen;
            }

            footer {
                height: 100px;
                background-color: orchid;
            }
