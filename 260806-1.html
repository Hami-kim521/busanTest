<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>em, rem</title>
        <style>
            html {
                font-size: 20px;
            }

            h1 {
                font-size: 2rem;
                /* 20px = 1rem => 20*2 = 40px */
            }

            #parents {
                font-size: 50px;
                width: 300px;
                height: 300px;
                background-color: skyblue;
            }

            #child {
                font-size: 0.7em;
                /* 16px * 0.7 = 11.2px*/
            }
        </style>
    </head>
    <body>
        <h1>안녕하세요</h1>
        <div id="parents">
            <div id="child">김하미</div>
        </div>
    </body>
</html>

<!-- 
    <em, rem>
    - 상대 단위
    - 폰트 크기
    - 여백, 레이아웃 조절할 때도 사용

    1) em
    => element(요소, 태그)의 줄임말, 부모 요소의 font-size가 1em
    ex) 부모 요소의 font-size: 30px -> 1em
    => 패딩

    2) rem : 
    => root element의 줄임말, html =  root
    => html의 font-size가 1rem
    => 브라우저가 자동으로 가지고 있는 font-size = 16px => 16px = 1rem
    => 기본 폰트 크기, 마진, 섹션 간의 간격

    주로 레이아웃, 요소든 너비, 높이에 사용하는 단위 -> px, %, vw, vh

-->
