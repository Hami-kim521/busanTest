    <JS(자바스크립트)>
    프로그래밍 ? program + img = 프로그램을 만드는 행위
    웹 프로그래밍 ? 웹과 관련된 프로그램을 만드는 행위 -> 웹 브라우저와 관련된 프로그램을 작성하는 것
    웹사이트가 작동 과정 : 서버컴퓨터 vs 사용자 컴퓨터
    => 사용자의 요청을 처리하고 데이터를 관리(Back-end) vs 서버에서 받아 온 정보를 웹브라우저에 보여줄 때 어떻게 보여줄지를 프로그래밍(Front-end)
    => 풀스택(full-stack)

    C언어, JAVA 바탕
    객체지향언어(ex. 버튼을 클릭하면 해당 페이지를 보여주는 명령)
    HTML문서에 웹페이지의 동적인 효과
    => 서버를 만들어나 웹에서 작동하는 프로그램을 만드는 여러가지 일을 하는 유연한 언어(코드는 엄격하게 작성해야함)

    <JS - Data Types>
    6개의 원시 타입, 1개의 객체 타입

    1) 원시타입(Primitive Type)
    - Number(숫자) : 1, 2, 3, ...
    - String(문자열) : '김하미', 'Snake', ...
        -> '1'(문자열)
    - Boolean(불리언) : true, false
    - undefined : 변수는 존재함, 어떠한 값으로 할당이 되지 않은 상태
    - null : 변수도 존재하고, null이라는 값으로 할당이 된 상태 -> 이전의 값을 더이상 참조하지 않겠다는 의미(개발자가 의도적으로 설정한 값)
    - Symbol : 유일무이한 값을 생성할 때 사용, 다른 원시타입과는 다르게 symbol 함수를 호출해서 사용(사용 빈도는 낮음)

    2) 객체타입(Objective Type)
    - 함수(Function) : 어떤 일(동작)을 처리할 때 사용
    - 배열(Array) : 여러 개의 값(타입)을 순서대로 나열해서 모아 놓은 목록
    - 객체(Object) : 어떤 대상 하나에 대한 여러 정보를 묶어서 보관할 때 사용

    <문법>
    - 대소문자 구별함(color COLOR)
    - 들여쓰기 -> 가독성을 위해 들여쓰기 필요
    - 메모를 위해 주석사용!!!!
    - ;(세미콜론)으로 문장을 구분
        => ; 붙이지 않아도 실행이 되지만 줄바꿈 하지 않고 계속 작성할 시 컴퓨터는 오류 발생! 이를 방지하기 위해 ; 붙이기
        ex) let fruit = 'apple';
            let fruit1 = 'melon';

        background-color: black; 
        color: white;

    <변수(Variable) vs 상수(Constant)>
    -  변수 : 다양한 데이터를 이름을 지정해서 쉽고 반복적으로 사용할 수 있도록 담는 그릇
    -  상수 : 다양한 데이터를 이름을 지정해서 쉽고 반복적으로 사용할 수 있도록 담는 그릇

    - 변수랑 상수의 차이? 변수는 데이터(값)를 재할당, 상수는 데이터(값)를 재할당X

    - 변수 작성법
        1) 언더스코어(_) 넣어서 구분하는 snake_case => 파이썬에서 주로 사용
        2) 모든 단어를 대소문자로 시작해서 구분하는 PascalCase => C#같은 마이크로소프트 계열의 언어에서 사용
        3) 두번째 단어부터 대문자로 시작해 구분하는  camelCase => 대부분의 언어 사용
        4) 문자와 숫자, $, _ 만 사용함 
        5) 첫 글자가 숫자가 될 수 없음
        6) 예약어 사용X
            => arguments, break, case, continue, do, else, if, null, default, true, false, this, return, super, try, typeof, void, while, with...

    
    - 변수, 상수 선언 키워드
    
    1) 변수 선언 : let 
    2) 상수 선언 : const 
    

    - 변수(상수) 선언했다, 값을 할당 => 보통은 선언과 할당이 동시에 이뤄짐
    ex) let name = 'Hami Kim';
