    <연산자>

    - 산술연산자

    덧셈 : +
    뺄셈 : -
    곱셈 : *
    나눗셈 : /
    나머지 : %
    제곱 : **

    문제)
    2개 수를 직접 입력 -> 나누기, 더하기 연산

    - 비교연산자(조건문)

    <
    >
    <=
    >=
    == 같다(1 == '1') 단순 비교 / 같지 않다(!=)
    === 같다 => 양쪽의 데이터 타입까지 비교 / 같지 않다(!==) => 이걸 더 많이 사용! 자바스크립트가 유연한 언어라서 엄격하게 코드를 짜야함

    - 할당연산자

    += => x = x + y => x += y
    -= => x = x - y => x -= y
    *= => x = x * y => x *= y
    /= => x = x / y => x /= y
    %= => x = x % y => x %= y
    **= => x = x ** y => x **= y

    - 증감연산자(반복문)

    1) 전위증감 : ++x, --x : 1씩 증가 or 감소
    2) 후위증감 : x++, x-- : 1씩 증가 or 감소 => 사용 빈도 수 높음
    
    
    - 논리연산자(조건문, 반복문)
    1) and(&&) : 모든 조건이 true => true 
    2) or(||) : 하나라도 조건이 true => true => 조건이 둘다 false false를 반환

    ex) let num1 = 10;
        let num2 = 30;

        console.log(num1 < num2 && num1 < 20); => true
        console.log(num1 < 20 && num1 > num2); => false
        
        console.log(num1 < num2 || num1 < 20); => true
        console.log(num1 < 20 || num1 > num2); => true

    숫자 2개 입력받고, 입력 받은 수를 비교해서 콘솔창에 결과가 나오게
