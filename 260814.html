    <조건문>
    조건을 만족하는 데이터를 실행하고 처리할 때

    1) if문(비교하거나 논리조건을 따질 때, 비교대상이 하나의 값이 아니라 조건식 일 때 주로 사용)

    - if(조건1) {
        조건1이 만족을 했을 때 실행될 코드
    } else {
        조건1이 거짓일 때 실행될 코드
    }

    - if(조건1) {
        조건1이 만족을 했을 때 실행될 코드
    } else if(조건2) {
        조건1은 거짓이고 / 조건2가 만족을 했을 때 실행될 코드 
    } else {
        조건1, 2 둘 다 거짓일 때 
    }   

    - 삼항 연산자(3개의 피연산자를 사용하는 연산자)
    => if문의 단축형태
    => 조건식 ? true일 경우 실행할 코드 : 거짓일 때 실행할 코드

    if(number % 2 === 0) {
        console.log('짝수');
    } else {
        console.log('홀수');
