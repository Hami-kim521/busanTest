    <함수>
    일련의 과정을 구문(statement)으로 구현하고 코드 블럭으로 감싸서 하나의 실행 단위로 정의한 것
    => 하나의 동작, 어떤 목적을 달성하거나 원하는 결과를 도출하기 위한 코드 집합
    => 한 번만 쓰는게 아니라 반복적인 동작을 처리하기 위해 사용
    => 같은 이름으로 재사용

    1. 기능을 적절하게 표현하는 이름
    2. 명사보다는 동사로 된 이름
    3. 소문자로 시작하되 여러 단어가 섞인 경우 카멜 표기법 사용
    ex) sayHello, numberListing

    - 매개변수 : 함수 내부로 입력을 전달받는 변수, 함수의 정의에서 사용되는 변수
    - 인자, 인수 : 함수에서 정의된 일련의 과정을 실행하기 위해서 필요한 값, 매개변수에 할당되는 값
    - 반환값 : 함수의 실행 결과 값


    <함수를 표현하는 방법>

    - 선언식

    function 함수명(매개변수) {
        함수의 기능을 표현한 코드
    }

    함수명(인자, 인수); => 함수 호출

    ------------------------------------

    - 표현식

    const 함수명 = function(매개변수) {
        함수의 기능을 표현한 코드
    }

    함수명(인자, 인수);
