<!-- 
    <제이쿼리 사용 순서>
    1. 웹사이트에 제이쿼리 cdn 검색
    2. 제이쿼리 cdn 사이트 들어가서 최신버전(맨 위에 있는) 중에 minified로 선택
    3. 스크립트 태그 안에 src 링크를 복사해서 새 탭에서 열기
    4. 코드 전체 선택해서(ctrl+a) 복사해서 VScode 열어서 js파일 하나 만들기
    5. 복사한 코드 붙여넣기하고 저장
    6. title 태그 밑에 script 태그만들고 src 속성 입력하고 jquery 파일 연결하기

    **참고사항
    1. 외부(웹사이트 등)에서 불러오거나 연결하는 파일들(css, js)은 무조건 head태그 안에 있어야 함
    2. 내가 작성한 스크립트 코드의 경우는 닫히는 body태그에 script태그가 있어야 하고, 만약 폴더 내에 내가 만든 js파일을 연결할거면
    닫히는 body태그에 <script src="파일이름.js"></script> 이렇게 입력되어 있어야 함.

    <제이쿼리>
    자바스크립트에서 여러 명령을 함수화시켜 만들어진 라이브러리 형태의 언어(괄호 주의!!!!!!)

    $(document).ready(function() {
        //웹문서가 로딩이 다 되면 실행될 코드
    });

    - 선택자
    => 아이디 => #id 
    => 클래스 => .class
    => 구조선택자 => nth-child(), first-child, last-child
    => 태그선택자 => body, div, h1~h6, header, section, ...

    css에서는

    #name {
        color: white;
        font: 900 50px /100px '';
    }

    jquery에서는
    
    $('#아이디명').명령({
        //속성
    });

    $('.클래스명').명령({
        //속성
    });

    $('선택자:nth-child(n)').명령({
        //속성
    });

    ex) <div id="name"></div>

    css코드를 jquery로 작성할 시 css는 명령으로 들어옴

    ex)

    $('#name').css({
        width: 100 + 'px',
        width: '100px',
        width : 100, //단위가 없으면 무조건 px 단위, %, em, rem, vw, vh 등의 경우는 숫자만 적으면 안됨.
    });
