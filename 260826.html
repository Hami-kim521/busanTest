    <animate>
    시간에 따른 움직임 또는 애니메이션 작업시 사용
    애니메이트 적용 속성
    - 크기값:width, height
    - 여백값:margin, padding
    - 위치값:left, right, top, bottom(position 필수)
    - 투명도:opacity(0~1)
    - 스크롤 영역값

    $(선택자).animate({
        속성: 속성값,
    }, 시간, 가속도 형태, 콜백함수);

    => 시간 : 1s => 1000
    => 가속도 형태 : 플러그인 사용
    => animate 시작하고 동작 완료 후에 콜백함수로 다음 동작을 실행
