<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>변수값 조절</title>
        <script src="jquery.js"></script>
    </head>
    <body>
        

        <!-- <div id="box"></div> -->

        <div id="wrap">
            <div id="con">
                <div id="circle"></div>
            </div>

            <div id="btn">click</div>


        </div>

        <script>
            $(document).ready(function() {
                
                // $('#box').css({
                //     width:300,
                //     height:300,
                //     backgroundColor: 'salmon',
                // });

                // let i = 0; //박스를 누른 횟수

                // $('#box').click(function() {
                //     if(i == 0) {
                //         $(this).css({
                //             backgroundColor: 'lightblue',
                //         });
                //         i++;
                //     } else if(i == 1) {
                //         $(this).css({
                //             backgroundColor: 'gold',
                //         });
                //         i++;
                //     } else if(i == 2) {
                //         $(this).css({
                //             backgroundColor: 'salmon',
                //         });
                //         i = 0;
                //     }
                // });


                $('#wrap').css({
                    width: 600,
                    height: 300,
                    border: '10px solid black',
                    margin: '50px auto',
                });

                $('#con').css({
                    width: 600,
                    height: 200,
                    position: 'relative',
                });

                $('#circle').css({
                    width: 200,
                    height: 200,
                    borderRadius : '50%',
                    position: 'absolute',
                    top:0,
                    left:0,
                    backgroundColor: 'tomato',
                });

                $('#btn').css({
                    width: 600,
                    height: 100,
                    backgroundColor: 'lightgreen',
                    textAlign: 'center',
                    lineHeight: '100px',
                    cursor: 'pointer',
                });


                let cw = $('#circle').width(); //200
                let i = 0; //클릭 횟수

                $('#btn').click(function() {
                    if(i == 0) {
                        $('#circle').animate({
                            left: cw,
                        }, 1000);
                        i++
                    }else if(i == 1) {
                        $('#circle').animate({
                            left: cw*2,
                        }, 1000);
                        i++;
                    } else if(i == 2) {
                        $('#circle').animate({
                            left: 0,
                        }, 1000);
                        i=0;
                    }
                }); 












            }); //end




            
        </script>
    </body>
</html>
