<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="jquery.js"></script>
    </head>
    <body>
        
        <!-- <div style="width:100px; height: 100px; background-color: aquamarine;"></div>  -->

        <!-- 닭 예제 -->
        <div id="box">

        </div>





        <script>

                // });

                // $('img').attr({

                //     height:400,
                // });

                // $('img').removeAttr('alt');
                // $('img').removeAttr('width');
                $('*').css({
                    padding: 0,
                    margin: 0,
                });

                $('#box').css({
                    width: 500,
                    height: 500,
                    border: '10px solid black',
                    margin: '100px auto',
                });

                $('#box img').css({
                    width: 500,
                    height: 500,
                    display:'block',
                    border: 'none',
                });


                // let i = 0;

                /*
                    $('선택자', this)
                    => 자기자신 안에서 자신을 다시 선택할 때 사용
                    => 이벤트 발생시 이벤트 발생의 영역을 지정할 때 사용
                */
                // $('#box').click(function(){

                //     if(i === 0) {
                //         $('#box img').attr({
                //             src : 'color_chicken.png',
                //         });
                //         i++;
                //     } else if(i === 1) {
                //         $('img', this).attr({
                //             src : 'normal_chicken.png',
                //         });
                //         i=0;
                        
                //     }
                // });

                $('#box').hover(function() {
                    $('img',this).attr({
                        src : 'color_chicken.png',
                    });
                }, function() {
                    $('#box img').attr({
                        src: 'normal_chicken.png',
                    });
                });




            });



        </script>
    </body>
</html>

    태그의 속성을 추가 제거할 때 사용

    ex) <a href=""></a>, <img src="" alt="">
