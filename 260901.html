<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>text</title>
        <style>
            *{
                padding: 0;
                margin: 0;
            }

            #wrap {
                width: 300px;
                height: 100px;
                border: 1px solid lightgrey;
                border-radius: 5px;
                margin: 50px auto;
                display: flex;
            }

            .btn {
                width: 80px;
                height: 80px;
                background-color: lightblue;
                color: dimgrey;
                /* text-align: center;
                font: 900 60px / 80px ''; */
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 60px;
                user-select: none;
                cursor: pointer;
                border-radius: 5px;
                margin: 10px;
            }

            #num {
                width: 100px;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 60px;
            }

            #text {
                text-align: center;
                font-size: 10px;
            }

        </style>
        <script src="jquery.js"></script>
    </head>
    <body>
        
        <div id="wrap">
            <div class="btn" id="minus">&#45;</div>
            <div id="num">0</div>
            <div class="btn" id="plus">&#43;</div>
        </div>
        <p id="text">미리보기 텍스트입니다.</p>


        <script>
            $(document).ready(function() {

                /*
                    <text()>
                    선택자에 텍스트를 입력하는 명령어

                    $('선택자').text('텍스트');
                    ex) $('#num').text('1');
                */

                let num = 0;
                
                //plus 버튼을 클릭했을 때 폰트크기가 커지고, 숫자가 올라가고 화면에 표시
                $('#plus').click(function() {
                   
                    if(num > 9) {
                        return;
                    }
                    num++;
                    $('#num').text(num);
                    $('#text').css({
                        fontSize : num*5 + 10 + 'px',
                    });
                });

                $('#minus').click(function() {
                   
                    if(num < 1) {
                        return;
                    }
                    num--;
                    $('#num').text(num);
                    $('#text').css({
                        fontSize : num*5 + 10 + 'px',
                    });
                });







            });




        </script>
    </body>
</html>

<!-- 
    문제

    css =
    수량 표시 (0~10)
    전체 사이즈 300*100 / 테두리 / 5px 둥글기 / 중앙정렬
    버튼 크기 80*80 / 5px 둥글기 / 배경색 / 폰트 60px

    script = 버튼 클릭시 수량 증감






-->
