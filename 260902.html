<!-- 
    문제)
    박스크기 500*500, 이미지 삽입
    클릭시 이미지 변경
    1초마다 계속 이미지 변경 실행
    5초뒤 실행중지

    <nth-child(n)>
    => .eq(index) => index는 0부터 시작

    ver1. 첫번째 자식 선택
    $('#box:first-child').css({
        backgroundColor: 'tomato',
    });

    ver2.
    $('#box').first().css({
        backgroundColor: 'tomato',
    });

    ver3.
    $('#box').eq(0).css({
        backgroundColor: 'tomato',
    });

    ver1. 마지막 자식 선택
    $('#box:last-child').css({
        backgroundColor: 'tomato',
    });

    ver2.
    $('#box').last().css({
        backgroundColor: 'tomato',
    });

    ver3.
    $('#box').eq(4).css({
        backgroundColor: 'tomato',
    });

    

    <find>
    => .find()
    => 부모 안쪽에 원하는 자식선택자를 찾아서 선택

    $('#con_wrap').find('a').css({
        color: 'white',
    });

    <이동명령>
    1) $('선택자1').appendTo('선택자2');
    => 선택자1 = 자식, 선택자2 = 부모
    => 선택자1을 선택자2 안에서 맨 뒤쪽 이동
    => ex) $('#con_wrap li').first().appendTo('#con_wrap');
    
    2) $('선택자1').prependTo('선택자2');
    => 선택자1을 선택자2 안에서 맨 앞쪽 이동
    => ex) $('#con_wrap li').last().prependTo('#con_wrap');

    3) $('선택자1').insertBefore('선택자2');
    => 선택자1이 선택자2 바로 앞쪽 이동

    4) $('선택자1').insertAfter('선택자2');
    => 선택자1이 선택자2 바로 뒤쪽 이동

    => insertBefore, insertAfter에서 선택자2번 중요
    => 만약에 선택자 1, 2의 관계가 형제라면

    <ul id="con_wrap">
        <li>1</li>
        <li id="two">2</li>
        <li class="five">5</li>
    </ul>

    $('#con_wrap').last().insertBefore('#two');

    <ul id="con_wrap">
        <li>1</li>
        <li class="five">5</li>
        <li id="two">2</li>
    </ul>

    => 만약에 선택자 1, 2의 관계가 부모 자식이라면

    $('#con_wrap').last().insertBefore('#con_wrap');

    <li class="five">5</li>
    <ul id="con_wrap">
        <li>1</li>
        <li id="two">2</li>
    </ul>
