<!-- 

    <addClass>
    => 기존 클래스 + 클래스 속성을 추가하는 명령어
    $('선택자').addClass('클래스명'); 
    ex) $('#box').addClass('active'); => 클래스명만 적기! .(마침표) 안적음!!!
 
    <removeClass>
    => 기존 클래스 + 추가된 클래스 속성을 삭제하는 명령어
    $('선택자').removeClass('클래스명'); 
    ex) $('#box').removeClass('remove'); => 클래스명만 적기! .(마침표) 안적음!!!

    <toggleClass>
    => 지정된 클래스값이 있으면 제거, 없으면 추가
    $('선택자').toggleClass('클래스명'); 
    ex) $('#box').toggleClass('toggle'); => 클래스명만 적기! .(마침표) 안적음!!!

    jqueryui플러그인 설치 후
    addClass, removeClass에 시간값 추가 가능
    => 애니메이션 작업 가능

    animate()
    => 사용가능한 속성값이 정해짐
    => 시간차를 두고 색상 변경 불가

    addClass, removeClass로 애니메이션 작업을 하는 경우
    => 기존 css스타일에 대부분 속성값을 활용
    => 시간차를 두고 색상 변경 가능
    => 클래스속성으로 추가 제거하므로 우선순위 확인
