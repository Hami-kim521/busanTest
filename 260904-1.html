<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>slide example</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            img {
                display: block;
                border: 0;
            }

            #wrap {
                width: 600px;
                height: 400px;
                border: 10px solid black;
                overflow: hidden;
                margin: 0 auto;
                position: relative;
            }

            #img_wrap {
                width: 3000px;
                height: 400px;
                position: absolute;
                top: 0;
                left: 0;
            }

            #img_wrap img {
                float: left;
                width: 600px;
                height: 400px;
            }

            #btn_wrap {
                width: 250px;
                height: 50px;
                position: absolute;
                bottom: 20px;
                left: 50%;
                margin-left: -125px;
            }

            #btn_wrap li {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                color: white;
                background-color: black;
                text-align: center;
                float: left;
                font: 20px / 40px '';
                margin-right: 5px;
                cursor: pointer;
            }

            #text_wrap {
                width: 200px;
                height: 150px;
                position: absolute;
                top: 20px;
                left: 20px;
            }

            #text_wrap li {
                width: 100%;
                height: 100%;
                font: 40px / 150px '';
                text-align: center;
                position: absolute;
                top: 0;
                left: -250px;
            }

            #text_wrap li:first-child {
                left: 0;
            }

            #btn_wrap li.active {
                background-color: dimgrey;
                color: white;
            }
        </style>
        <script src="jquery.js"></script>
    </head>
    <body>
        
        <div id="wrap">
            <div id="img_wrap">
                <img src="alpacca.jpg" alt="알파카">
                <img src="capybara.jpg" alt="카피바라">
                <img src="quokka.jpg" alt="쿼카">
                <img src="miniPig.jpg" alt="아기돼지">
                <img src="hippo.jpg" alt="하마">
            </div>
            
            <ul id="btn_wrap">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
            </ul>

            <ul id="text_wrap">
                <li>첫번째</li>
                <li>두번째</li>
                <li>세번째</li>
                <li>네번째</li>
                <li>다섯번째</li>
            </ul>
        </div>


        <script>
            $(document).ready(function() {

                let bg = ['royalblue', 'lightgreen', 'pink', 'teal', 'tomato'];

                $('#text_wrap li').css({
                    backgroundColor : function(index) {
                        return bg[index];
                    }
                });

                $('#btn_wrap li').click(function() {
                    let i = $(this).index();

                    $('#img_wrap').animate({
                        left: -600 * i,
                    });

                    //버튼 색 변경 이벤트
                    $('#btn_wrap li').removeClass('active');
                    $(this).addClass('active');

                    //텍스트 박스 가로 방향으로 밖으로 나갔다 들어오기
                    $('#text_wrap li').eq(i).animate({
                        left: 0,
                    });

                    $('#text_wrap li').not($('#text_wrap li').eq(i)).animate({
                        left: -220,
                    });

                    //.not(선택자) : 이 선택자를 제외하고
                });


                



            }); //end




        </script>
    </body>
</html>

    윗부분, 왼쪽부분 여백 20px

    텍스트 배경색 배열 반환
    텍스트, 버튼 순서값 지정

       순서값이 아닌 객체는 밖으로 이동
