<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            ul, li {
                list-style: none;
            }

            #wrap {
                width: 600px;
                height: 700px;
                border: 10px solid black;
                margin: 50px auto;
                text-align: center;
            }

            #menu_wrap {
                width: 100%;
                height: 100px;
                position: relative;
            }

            #menu_wrap li {
                width: 25%;
                height: 100%;
                float: left;
                font: 30px / 100px '';
            }

            #box_wrap {
                width: 100%;
                height: 600px;
                position: relative;
            }

            #box_wrap li {
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
                font: 100px / 600px '';
                display: none;
            }

        </style>
        <script src="jquery.js"></script>
    </head>
    <body>

        <div id="wrap">
             <ul id="menu_wrap">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </ul>
            <ul id="box_wrap">
                <li>첫번째</li>
                <li>두번째</li>
                <li>세번째</li>
                <li>네번째</li>
            </ul>
        </div>
       






        <script>
            $(document).ready(function() {
                
                let bg = ['gold', 'tomato', 'lightgreen', 'royalblue'];

                $('#box_wrap li').css({
                    backgroundColor :function(index) {
                        return bg[index];
                    }
                }).first().css({
                    display: 'block',
                });


                $('#menu_wrap li').css({
                    backgroundColor :function(index) {
                        return bg[index];
                    }
                }).click(function() {
                    let i = $(this).index(); //선택자의 인덱스 속성 $('선택자').index();

                    $('#box_wrap li').fadeOut(1000);
                    $('#box_wrap li').eq(i).slideDown(1000);

                });

            }); //end



        </script>
    </body>
</html>
