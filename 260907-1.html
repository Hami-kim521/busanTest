<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            img {
                display: block;
                border: 0;
            }


        </style>
        <script src="jquery.js"></script>
    </head>
    <body>
        <div id="wrap">
            <div id="img_wrap">
                <img src="capybara.jpg" alt="카피바라">
                <img src="quokka.jpg" alt="쿼카">
                <img src="hippo.jpg" alt="하마">
            </div>

            <div class="arrow" id="left">&lt;</div>
            <div class="arrow" id="right">&gt;</div>
        </div>        

        <script>
            $(document).ready(function() {

                let ww = $(window).width();

                function layout() {
                    $('#wrap').css({
                        width: ww * 0.8,
                        height: ww * 0.5,
                        border: '10px solid black',
                        position: 'relative',
                        overflow: 'hidden',
                        margin: '50px auto',
                    });

                    $('#img_wrap').css({
                        width: ww * 2.4,
                        height: ww * 0.5,
                        position: 'absolute',
                        top: 0,
                        left: 0,
                    });

                    $('#img_wrap img').css({
                        width: ww* 0.8,
                        height: ww * 0.5,
                        float: 'left',
                    });

                    $('.arrow').css({
                        width: ww * 0.1,
                        height : ww * 0.1,
                        backgroundColor: 'white',
                        position: 'absolute',
                        top: '50%',
                        marginTop : -ww * 0.05,
                        font: `900 50px / ${ww*0.1}px ''`,
                        textAlign: 'center',
                    });

                    $('#left').css({
                        left:0,
                    });

                    $('#right').css({
                        right:0,
                    });
                }

                layout();
                

                $(window).resize(function() {
                    ww = $(window).width();
                    layout();
                })

                let i = 0;
                $('#right').click(function() {
                    i++;
                    if(i > 2) {
                        i = 0;
                    }

                    $('#img_wrap').animate({
                        left: - ww*0.8*i,
                    });
                });

                setInterval(function() {
                    $('#right').trigger('click');
                }, 2000);



            });


        </script>
    </body>
</html>
