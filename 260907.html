                function layout() {
                    let ww  = $(window).width();
                    let wh = $(window).height();

                        width: boxW,
                        height: boxH,
                        backgroundColor : 'lightblue',
                        position: 'absolute',
                        top : '50%',
                        left: '50%',
                        marginTop : -(boxH / 2),
                        marginLeft : -(boxW / 2),
                    }); 
                }
