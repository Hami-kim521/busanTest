                //카드 뒤집기
                let i = 0;


                function motion() {
                    if(i === 0) {
                        $('#front').transition({
                            rotateY : 180,
                            opacity: 0,
                        }, 1000);

                        $('#back').transition({
                            rotateY : 0,
                            opacity: 1,
                        }, 1000);

                        i++;
                    } else if(i === 1) {
                        $('#front').transition({
                            rotateY : 0,
                            opacity: 1,
                        }, 1000);

                        $('#back').transition({
                            rotateY : 180,
                            opacity: 0,
                        }, 1000);

                        i=0;
                    }
                }

                //motion();

                $('#wrap').click(function() {
                    motion();
                });
