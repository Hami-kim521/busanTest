<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>scroll</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            body {
                height: 2000px; 
                /* scroll 내릴 높이가 필요하니까 큰 값으로 */
            }

            div {
                width: 100%;
                font-size: 40px;
                text-align: center;
            }

            #btn {
                height: 100px;
                background-color: gold;
                cursor: pointer;
            }

            #box1 {
                height: 500px;
                background-color: deepskyblue;
            }

            #box2 {
                height: 300px;
                background-color: royalblue;
            }

        </style>
        <script src="jquery.js"></script>
    </head>
    <body>
        
        <div id="btn">click</div>

        <div id="box1">스크롤 높이값 확인</div>
        <div id="box2">그냥 박스</div>

        <script>
            $(document).ready(function() {
                $('#btn').click(function() {
                    $('html, body').animate({
                        scrollTop: 600,
                    });
                });

                

                //console.log(sct);



                $(window).scroll(function() {
                    let sct = $(window).scrollTop();

                    if(sct > 0) {
                        $('#box2').css({
                            backgroundColor: 'tomato',
                        }).stop().animate({
                            width: '50%',
                            //animate에서 인식하는 이벤트 중 하나의 이벤트가 끝나기 전에 다음 움직임이 들어가지
                        }, 1000);
                    } else {
                        $('#box2').css({
                            backgroundColor: 'royalblue',
                        }).stop().animate({
                            width: '100%',
                        }, 1000);
                    }
                });
                

            }); //end




        </script>
    </body>
</html>



<!-- 
    <scroll>
    => 초기 위치값으로 최상단이 0
    => scrollTop값을 이용해서 위치를 변경하려면 선택자를 html, body 로 선택


    $(window).scroll(function() {
        //code...
    });

    메뉴, 각 섹션 제작 후 색상 설정

    마우스 휠로 스크롤 움직일때에도 동일하게 제작



-->
