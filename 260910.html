<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>top_btn 레이아웃</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            #wrap {
                width: 100%;
            }

            header, section, footer {
                width: 100%;
                text-align: center;
                font-size: 50px;
            }

            header {
                height: 100px;
                background-color: lightgrey;
                line-height: 100px;
            }

            section {
                height: 800px;
                background-color: royalblue;
                line-height: 800px;
                margin-bottom: 100px;
            }

            footer {
                height: 200px;
                background-color: slategray;
                line-height: 200px;
            }

            #top_btn {
                width: 100px;
                height: 100px;
                text-align: center;
                font: bold 30px / 100px '';
                background-color: tomato;
                position: fixed;
                right: 100px;
                bottom: 100px;
                opacity: 0;
                cursor: pointer;
                transition: 0.5s;
            }


        </style>
        <script src="jquery.js"></script>
    </head>
    <body>
        <div id="wrap">
            <header>header</header>
            <section>sec1</section>
            <section>sec2</section>
            <footer>footer</footer>
            <div id="top_btn">TOP</div>
        </div>





        <script>
            $(document).ready(function() {

                $(window).scroll(function() {
                    let sct = $(window).scrollTop();
                    
                    if(sct > 100) {
                        $('#top_btn').css({
                            opacity: 1,
                        });
                    } else {
                        $('#top_btn').css({
                            opacity: 0,
                        });
                    }
                });

                $('#top_btn').click(function() {
                    $('html, body').animate({
                        scrollTop : 0,
                    }, 500);
                });

            }); //end







        </script>
    </body>
</html>
