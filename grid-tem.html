!<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>grid line</title>
        <style>

        * {
            padding: 0;
            margin: 0;
        }

        .container {
            width: 800px;
            height: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            grid-gap: 10px;
            margin: 50px auto;
            text-align: center;
            font: 30px / 260px '';
            grid-template-areas: "box1 box1 box2"
                                 "box3 box5 box2"
                                 "box3 box4 box4";
        }

        #box1 {
            background-color: steelblue;
            grid-area: box1;
        }

        #box2 {
            background-color: springgreen;
             grid-area: box2;
            line-height: 530px;
        }

        #box3 {
            background-color: tomato;
             grid-area: box3;
            line-height: 530px;
        }

        #box4 {
            background-color: gold;
             grid-area: box4;
        }

        #box5 {
            background-color: violet;
             grid-area: box5;
        }




        </style>
    </head>
    <body>
        <div class="container">
            <div class="items" id="box1">1</div>
            <div class="items" id="box2">2</div>
            <div class="items" id="box3">3</div>
            <div class="items" id="box4">4</div>
            <div class="items" id="box5">5</div>
        </div>
    </body>
</html>
