<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <!-- 1. 클릭할 링크 -->
    <nav>
        <a href="#section1" target="_blank">1번 섹션으로 이동</a>
        <a href="#section2">2번 섹션으로 이동</a>
    </nav>

    <!-- 2. 이동할 대상 섹션 (id 지정) -->
    <section id="section1" style="height: 600px; padding-top: 20px;">
        <h2>1번 섹션</h2>
        <p>1번 섹션 내용입니다.</p>
    </section>

    <section id="section2" style="height: 600px; padding-top: 20px;">
        <h2>2번 섹션</h2>
        <p>2번 섹션 내용입니다.</p>
    </section>
</body>
</html>
