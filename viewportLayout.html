<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>viewport 레이아웃</title>
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            input {
                display: none;
            }

            #wrap {
                *width: 700px;
                width: 36.458vw;
                height: 400px;
                border: 10px solid black;
                margin: 100px auto;
                text-align: center;
            }

            #label_wrap {
                width: 30%;
                height: 100%;
                background-color: lightgrey;
                float: left;
            }

            label {
                display: block;
                width: 100%;
                height: 25%;
                font: 30px / 100px '';
            }

            .con {
                width: 70%;
                height: 100%;
                float: left;
                display: none;
                text-align: center;
                *font: 50px / 400px '';
                font: bold 2.614vw / 400px '';
            }

            #con1 {
                background-color: pink;
            }

            #con2 {
                background-color: teal;
            }

            #con3 {
                background-color: gold;
            }

            #con4 {
                background-color: royalblue;
            }

            /* 버튼 눌렀을 때 탭 메뉴 열리게 */
            #tab1:checked~#con1 {
                display: block;
            }

            #tab2:checked~#con2 {
                display: block;
            }

            #tab3:checked~#con3 {
                display: block;
            }

            #tab4:checked~#con4 {
                display: block;
            }

            /* 버튼 색깔과 컨텐츠 색깔 맞추기 */
            #tab1:checked~#label_wrap #btn1 {
                background-color: pink;
            }

            #tab2:checked~#label_wrap #btn2 {
                background-color: teal;
            }

            #tab3:checked~#label_wrap #btn3 {
                background-color: gold;
            }

            #tab4:checked~#label_wrap #btn4 {
                background-color: royalblue;
            }

        </style>
    </head>
    <body>
        <div id="wrap">
            <input type="radio" id="tab1" name="tab" checked>
            <input type="radio" id="tab2" name="tab">
            <input type="radio" id="tab3" name="tab">
            <input type="radio" id="tab4" name="tab">
            <div id="label_wrap">
                <label for="tab1" id="btn1">1</label>
                <label for="tab2" id="btn2">2</label>
                <label for="tab3" id="btn3">3</label>
                <label for="tab4" id="btn4">4</label>
            </div>

            <div class="con" id="con1">첫번째</div>
            <div class="con" id="con2">두번째</div>
            <div class="con" id="con3">세번째</div>
            <div class="con" id="con4">네번째</div>
        </div>
    </body>
</html>


<!-- 
    문제)

    viewport 단위를 이용한 탭메뉴 레이아웃
    1. wrap : 700*400 기준 상대값[가로] / 테두리 / 중앙정렬
    2. btn_wrap : 가로 30% 
    3. 각 라벨(버튼) 가로 부모 동일 / 폰트 30px 중앙정렬
    4. con : 가로 70% (각 색상 다르게) 전체 설정후 안보이게 가려두기
    5. 각 버튼 클릭했을때 순서에 해당되는 con이 보이고, 동일컬러로 변경      
    6. 본문 폰트사이즈 상대값






-->
